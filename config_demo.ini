[program]
;ключ активации программы
license_key =

[database]
;если у вас нет базы данных, то сотрите эту секцию полностью
;тип используемой внешней базы данных. Доступные типы: clickhouse, sqlite3, postgresql
type = clickhouse
;адрес сервера внешей базы данных
address = <address>
;наименование базы данных
name = securities_analytics
;порт подключения
port = 8123
;логин подключения
login = <login>
;пароль пользователя
password =
;глубина хранения данных в днях для хранения в базе данных
storage_depth_days = <days>

[client]
;если 1 - конфиг включен и программа его использует, если 0 - не использует
active = 0
;свой произвольный ID для использование в своей внешней базе данных
client_id = <client_id>
;тип подключения к API брокера: rest | grpc
broker_type_api = grpc
;Обязательно. токен подключения к API брокера
token =
;Обязательно. токен подключения к API брокера
token_grpc =
;Произвольное значение. Нужно для создания названия локальной папки и хранения в ней данных от счета.
login = <login>
;Торговый код для Финам или номер договора для Алор Нужно для отправки заявок через API брокера. Для Т-Инвестиции, БКС не надо, пустое значение
account_id = <account_id>
;Номер счета для отправки заявок через API брокера, если есть. Для Т-Инвестиции, БКС и АЛОР не надо, пустое значение
account_id_grpc = <account_id_grpc>
;свое произвольное имя для хранения во внешней базе данных
client_name = <client_name>
;Обязательно. наименование брокера: Finam | Alor | Tinkoff | BCS
broker_name = Finam
;полное наименование брокерской компании во внешней базе данных
broker_company = JSC Investment Company FINAM
;наиенование сервера брокера
broker_server = FINAM-AO
;Обязательно. тип используемого инстурмента: Bonds
type_account = Bonds
;Включить трансляцию сделок в стратегию автоследования
enable_autofollow_strategy = False
;Идентификатор стратегии автоследования автора
strategy_id = 522d43c9.......

[settings]
; Ошибки и предупреждения в ./logs/errors.log
enable_logs_errors = True
; Диагностика в ./logs/debug.log и в консоли
enable_logs_debugs = False
; Отправка рыночных и лимитных заявок в ./logs/transactions.log
enable_logs_transactions = False

;Предпочитать лимитную заявку при покупке облигаций. При подтверждённой недоступности используется рыночная.
enable_bonds_limit_order = False
;0 секунд отключает автоматическую отмену лимитной заявки.
execution_bonds_time_limit_order = 0
;типы досок MOEX.
;Доступны: TQCB,TQIR,TQOB через запятую.
;Используетcя, как фильтр для торговли и для анализа
boards = TQCB,TQIR,TQOB
portfolio_percent_bonds = 100
;процент от портфеля для облигаций
;100 - по умолчанию
;тикер фонда ликвидности
;Finam: FMMM | T-Investments: TMON | Alor: LQDT (нет своего фонда) | BCS: BCSD
;купится и продастся любой тикер
liquidity_fund = FMMM
;включить ли покупку по пятницам в 19:00 и продажу в понедельник в 9:00 или нет
enable_liquidity_fund_weekend = False
;включить ли покупку каждный день в 19:00 и продажу на следующий в 9:00 или нет
enable_liquidity_fund_everyday = False
;коэффициент умножения величины лота
k_count = 1
;включить ли перепроверку цены перед размещением заявки в рынок
use_getting_current_price = False
;Фильтр: ниже этой цены ничего не покупаем, кроме ОФЗ
low_price = 65
;Фильтр: ниже этой этого процента купона ничего не покупаем
low_couponpercent = 5
;налоговая ставка, которая используется при анализе бумаг
tax = 0.13
;Не докупает позицию больше этого количества уще купленных лотов
max_count_lot = 200
;фиксированная величина комиссии брокера на две стороны сделки
broker_comission_perdeal = 50
;Фильтр: Исключает бумаги ниже этого количества дней до погашения
days_planning_min = 5
;Фильтр: Исключает бумаги выше этого количества дней до погашения
days_planning_max = 365
;включить ли опцию мониторинга деградации цены позиции
enable_sell_degradating_position = False
;если цена снизилась на этот процент, то закрыть всю позицию
percent_degradating_position_for_sell = 5
;процент позиции от всего портфеля
p_risk = 2
;процент от полного ордера от позиции для входа
;100 - по умолчанию
order_open_percent = 100
;процент от полного от позиции для выхода
;100 - по умолчанию
order_close_percent = 100
;включить ли опцию ребалансировки позиций по параметру p_risk
enable_rebalancing_by_config = False
;скачать рассчитанный файл с анализом облигаций по API (доступно для подписки)
enable_download_data_exchange = False
;Включить стратегию "Пуля"
enable_max_date_for_close = False
;Дальше этой даты погащения ничего не покупать
max_date_for_close = 2026-06-30
;bonds_config - распределение долей портфеля в зависиомсти от дней погашения
;например 90-180:15
;где,
;90 - дней погашения "от"
;180 - дней погашения "до"
;15 - % процент портфеля для этого интервала погашений
;интервалы задаются через символ ";"
;bonds_config = 90-180:15;5-90:15;180-365:15;365-720:55
;stages_days_planning - порядок покупки, какие интервалы в первую очередь
;наример интервал погашений 90-180 ищется и покупается в первую очередь
;stages_days_planning = 90-180|5-90|180-365|365-720
;stages_bonds_config - более глубокая настройки интервалов,
;настройки для интервала задаются через имвол ":",
;а разделение интервалов происходит через "|"
;1) 90-180 - сам интервал погашений
;2) 15 - % процент портфеля на интервал
;3) 2 - % риск на позицию
;4) 2 - % минимально допустимое различие текущей цены от расчетной для покупки
;5) 12 - % цель - минимальная положительная разница позиции, чтобы закрыть
;6) 5 - % выход - максимальная просадка по позиции, чтобы деградировать позицию
;stages_bonds_config = 90-180:15:2:2:12:5|5-90:15:2:1:12:5|180-365:15:2:5:20:5|365-720:55:2:10:20:5
;время привязано к часовому поясу биржи, например MOEX - MSK +3
;время, когда начинать торговать
;schedule_hour_start_trading = 10
;время, когда заканчивать торговать
;schedule_hour_end_trading = 17
;время, когда производить ребалансировку портфеля
;schedule_hour_start_rebalancing = 10
;время, когда заканчивать производить балансировку портфеля
;schedule_hour_end_rebalancing = 17
;время, когда начинать следить и выполнять деградацию портфеля
;schedule_hour_start_degradating = 10
;время, когда заканчивать следить и выполнять деградацияю портфеля
;schedule_hour_end_degradating = 17
;время, когда начинаить покупать фонд ликвидности в пятницу
;schedule_hour_start_liquidity_weekend = 19
;время, когда начинаить продавать фонд ликвидности в понедельник
;schedule_hour_end_liquidity_weekend = 10
;номер дня недели, когда начинать покупать фонд ликвидности в конце недели
;schedule_day_start_liquidity_weekend = 5
;номер дня недели, когда начинать продавать фонд ликвидности в начале недели
;schedule_day_end_liquidity_weekend = 1
;время, когда покупать фонд ликвидности каждый день
;schedule_hour_start_liquidity_everyday = 19
;время, когда продавать фонд ликвидности каждый день
;schedule_hour_start_liquidity_everyday = 10
